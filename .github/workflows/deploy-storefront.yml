name: Deploy Storefront

on:
  push:
    branches:
      - main
    paths:
      - 'storefront/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/leewaa-ecom/storefront
            git pull origin main
            npm ci
            npm run build
            echo '{"apps":[{"name":"leewaa-storefront","cwd":"/var/www/leewaa-ecom/storefront","script":"npm","args":"start","env":{"PORT":"3003"}}]}' > /var/www/leewaa-ecom/storefront/ecosystem.json
            pm2 delete leewaa-storefront 2>/dev/null || true
            pm2 start /var/www/leewaa-ecom/storefront/ecosystem.json
            
      - name: Verify Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            pm2 status leewaa-storefront
            pm2 logs leewaa-storefront --lines 20
