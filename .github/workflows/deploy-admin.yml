name: Deploy Admin Panel

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/leewaa-ecom/admin
            git pull origin main
            npm ci
            npm run build
            echo '{"apps":[{"name":"leewaa-admin","cwd":"/var/www/leewaa-ecom/admin","script":"npm","args":"start","env":{"PORT":"3004"}}]}' > /var/www/leewaa-ecom/admin/ecosystem.json
            pm2 delete leewaa-admin 2>/dev/null || true
            pm2 start /var/www/leewaa-ecom/admin/ecosystem.json
            
      - name: Verify Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            pm2 status leewaa-admin
